<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="nameTitle">Urban Style</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" type="text/css" href="css/styles.css">

</head>

<body class="bg-white text-gray-900">

<!-- NAVBAR -->
<header class="flex justify-between items-center p-6 border-b">

<h1 class=" font-bold" id="nameFront">Urban Style</h1>

<a href="https://wa.me/" class="bg-black text-white px-4 py-2 rounded-lg">
Comprar
</a>

</header>

<!-- HERO -->
<section style="background-image: url('assets/images/hero.webp'); background-size: cover; background-position: center; background-repeat: no-repeat; color: white;" class="h-[70vh] flex items-center  justify-center bg-gray-100 text-center">

<div class="bg-black bg-opacity-50 p-8 rounded-lg">
<h2 class="text-5xl font-bold mb-4">
Nueva Colección 2026
</h2>

<p class="mb-6 ">
Estilo urbano moderno
</p>

<a href="https://wa.me/" class="bg-black text-white px-6 py-3 rounded-xl">
Ver productos
</a>
</div>

</section>

<!-- CATEGORÍAS -->
<section class="py-10 text-center">

<div class="flex justify-center gap-4 flex-wrap">

<button onclick="filterCategory('all')" class="px-4 py-2 border rounded-full">
Todo
</button>

<button onclick="filterCategory('hombre')" class="px-4 py-2 border rounded-full">
Hombre
</button>

<button onclick="filterCategory('mujer')" class="px-4 py-2 border rounded-full">
Mujer
</button>

<button onclick="filterCategory('accesorios')" class="px-4 py-2 border rounded-full">
Accesorios
</button>

</div>

</section>

<!-- PRODUCTOS -->
<section class="max-w-6xl mx-auto px-6 pb-16">

<div id="products" class="grid md:grid-cols-3 gap-8"></div>

</section>

<section class="bg-gray-100 py-16 ">
      <div class="max-w-6xl mx-auto px-4 text-center">
      <h3 class="text-3xl font-bold mb-6">Visítanos</h3>

      <p id="address" class="mb-4"></p>

      <p id="hours" class="mb-6"></p>

      <iframe
        class="w-full h-80 rounded-lg"
        src="https://maps.google.com/maps?q=4.207167,-74.639123&t=&z=16&ie=UTF8&iwloc=&output=embed"
      >
      </iframe>
    </section>

<section class=" py-16 text-center">
      <h3 class="text-3xl font-bold mb-6">Síguenos en nuestras redes</h3>

      <p class="mb-8">Descubre nuestros platos, promociones y novedades</p>

      <div class="flex justify-center gap-6">
        <a
          target="_blank"
          id="instagramLink"
          class="flex items-center gap-2 bg-pink-500 text-white px-6 py-3 rounded-lg"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="currentColor"
            viewBox="0 0 16 16"
          >
            <path
              d="M8 0C5.8 0 5.5 0 4.7.1 3.9.1 3.3.3 2.8.5a4 4 0 0 0-1.5 1A4 4 0 0 0 .5 3c-.2.5-.4 1.1-.4 1.9C0 5.7 0 6 0 8s0 2.3.1 3.1c0 .8.2 1.4.4 1.9a4 4 0 0 0 1 1.5 4 4 0 0 0 1.5 1c.5.2 1.1.4 1.9.4.8.1 1.1.1 3.1.1s2.3 0 3.1-.1c.8 0 1.4-.2 1.9-.4a4 4 0 0 0 1.5-1 4 4 0 0 0 1-1.5c.2-.5.4-1.1.4-1.9.1-.8.1-1.1.1-3.1s0-2.3-.1-3.1c0-.8-.2-1.4-.4-1.9a4 4 0 0 0-1-1.5 4 4 0 0 0-1.5-1c-.5-.2-1.1-.4-1.9-.4C10.3 0 10 0 8 0zm0 3.9A4.1 4.1 0 1 1 3.9 8 4.1 4.1 0 0 1 8 3.9zm0 6.7A2.6 2.6 0 1 0 5.4 8 2.6 2.6 0 0 0 8 10.6zm4.3-6.8a1 1 0 1 1-1-1 1 1 0 0 1 1 1z"
            />
          </svg>

          Instagram
        </a>

        <a
          target="_blank"
          id="facebookLink"
          class="flex items-center gap-2 bg-blue-600 text-white px-6 py-3 rounded-lg"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="currentColor"
            viewBox="0 0 16 16"
          >
            <path
              d="M16 8a8 8 0 1 0-9.2 7.9V10.3H4.9V8h1.9V6.2c0-1.9 1.1-3 2.9-3 .8 0 1.7.1 1.7.1v1.8h-1c-1 0-1.3.6-1.3 1.2V8h2.2l-.3 2.3H9.1v5.6A8 8 0 0 0 16 8z"
            />
          </svg>

          Facebook
        </a>
      </div>
    </section>
     <footer class="bg-gray-900 text-white text-center py-6">
      <p id="footerName"></p>

      <p id="footerPhone"></p>
    </footer>

<script src="config.js"></script>
<script src="js/main.js"></script>

</body>
</html>
